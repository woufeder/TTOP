    <script>
      (function restoreGitHubPagesRoute(location) {
        if (!location.search.startsWith('?/')) {
          return
        }

        const decodedPath = location.search
          .slice(2)
          .split('&')
          .map((segment, index) => (index === 0 ? segment : `?${segment}`))
          .join('')
          .replace(/~and~/g, '&')

        window.history.replaceState(null, '', `${location.pathname}${decodedPath}${location.hash}`)
      })(window.location)
    </script>
